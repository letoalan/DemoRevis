<!-- Modal Lightbox (Agrandissement & Rétrécissement au clic) -->
<div class="image-modal modal-overlay" id="image-modal" style="display: none;" role="dialog" aria-modal="true" aria-label="Agrandissement de l'image">
  <div class="modal-content" title="Cliquer pour rétrécir">
    <button type="button" class="modal-close-btn" aria-label="Rétrécir l'image et fermer" title="Rétrécir l'image (Échap)">✕</button>
    <img src="" alt="" class="modal-img" title="Cliquer pour rétrécir l'image" />
    <div class="modal-caption"></div>
  </div>
</div>
